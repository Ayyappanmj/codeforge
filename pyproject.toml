[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/shared", "apps/api", "apps/worker", "."]
filterwarnings = [
    "ignore::Warning:starlette.testclient",
    "ignore::Warning:fastapi.testclient",
    "ignore:.*Using `httpx` with `starlette.testclient`.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E9", "F", "B"]
ignore = ["B008"]
